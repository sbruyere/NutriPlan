<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriPlan — hors ligne</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #e9edf1; font-family: -apple-system, 'Segoe UI', ui-sans-serif, sans-serif; color: #101315; }
        .card { text-align: center; padding: 2rem; max-width: 22rem; }
        .logo { width: 56px; height: 56px; border-radius: 14px; background: #101315; margin: 0 auto 1.25rem;
                display: flex; align-items: center; justify-content: center; color: #c6f52c;
                font-weight: 800; font-size: 1.6rem; box-shadow: 0 16px 28px -16px rgba(8, 12, 16, .6); }
        h1 { font-size: 1.3rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
        p { color: #69737d; font-size: .9rem; line-height: 1.5; margin: 0 0 1.5rem; }
        a { display: inline-block; background: #c6f52c; color: #101315; font-weight: 800; text-decoration: none;
            padding: .75rem 1.5rem; border-radius: 10px; font-size: .8rem; letter-spacing: .06em;
            text-transform: uppercase; box-shadow: 0 2px 0 rgba(14, 17, 20, .18); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">N</div>
        <h1>Vous êtes hors ligne</h1>
        <p>NutriPlan a besoin d'une connexion pour afficher votre carnet.<br>Vos données vous attendent — rien n'est perdu.</p>
        <a href="/">Réessayer</a>
    </div>
</body>
</html>
